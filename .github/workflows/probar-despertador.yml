name: Probar despertador

# Mide el detector de "Oye Atlas" con audios de ejemplo, usando la misma regla que lleva el APK.
on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "pruebas/despertador/**"
      - "android/app/src/main/java/bo/capataz/app/EscuchaService.java"
      - ".github/workflows/probar-despertador.yml"
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install vosk
      - name: Modelo
        run: |
          curl -fsSL --retry 3 -o modelo.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q modelo.zip && mv vosk-model-small-es-0.42 modelo
      - name: Prueba
        run: python pruebas/despertador/probar.py modelo pruebas/despertador/wav android/app/src/main/java/bo/capataz/app/EscuchaService.java 50,80,110,160,220,350,500 2>/dev/null
