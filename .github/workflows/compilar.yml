name: Compilar APK y EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci --ignore-scripts
      - name: Proyecto Android
        run: |
          if [ ! -d android ]; then npm run android:add; else npm run android:sync; fi
      - name: Firma fija
        env: { KS: "${{ secrets.CAPATAZ_KEYSTORE }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/app/capataz.keystore
          else echo "::warning::Falta el secreto CAPATAZ_KEYSTORE, el APK no se podra instalar encima del anterior"; fi
      - name: APK
        env: { CAPATAZ_KS_PASS: "${{ secrets.CAPATAZ_KS_PASS }}" }
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk Capataz.apk
      - uses: actions/upload-artifact@v4
        with: { name: Capataz-apk, path: Capataz.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run electron:exe
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with: { name: Capataz-exe, path: "dist/*.exe" }

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Capataz v1.${{ github.run_number }}
          files: |
            Capataz.apk
            *.exe
